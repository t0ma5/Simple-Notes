<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>README screenshots</title>
  <style>
    body { margin: 0; font-family: Segoe UI, Roboto, sans-serif; background: #0f1114; color: #e8e8e8; padding: 28px 24px 60px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .shots { display: flex; gap: 16px; flex-wrap: wrap; }
    img { width: 240px; border-radius: 12px; display: block; }
    .cap { width: 240px; text-align: center; color: #8b949e; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>README screenshots (graphics/screenshots/)</h1>
  <div class="shots">
    <div>
      <img src="screenshots/screenshot-notes.png" alt="Notes">
      <div class="cap">Notes — default after install</div>
    </div>
    <div>
      <img src="screenshots/screenshot-notebooks.png" alt="Notebooks">
      <div class="cap">Notebooks</div>
    </div>
    <div>
      <img src="screenshots/screenshot-inside-notebook.png" alt="Inside notebook">
      <div class="cap">Work - Notebook</div>
    </div>
    <div>
      <img src="screenshots/screenshot-home-widgets.png" alt="Customize Widgets HomeScreen">
      <div class="cap">Customize Widgets HomeScreen</div>
    </div>
  </div>
</body>
</html>
